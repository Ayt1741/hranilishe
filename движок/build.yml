name: memory-engine-build
# Сборка поиска по памяти в облаке: 16 ГБ RAM, 4 CPU (ubuntu-latest).
# Зачем облако: песочница агента 2 ГБ не тянет bge-m3 — тут тянет (1,6 ГБ RAM, 0 VRAM).
on:
  workflow_dispatch:
    inputs:
      step:
        description: "build | eval | search"
        required: false
        default: "build"
      query:
        description: "текст запроса (для step=search)"
        required: false
        default: ""

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  LC_ALL: C.UTF-8
  HF_HOME: ${{ github.workspace }}/.hf
  TOKENIZERS_PARALLELISM: "false"

jobs:
  build:
    name: "сборка индекса + эмбеддинги"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Память и FTS5
        run: |
          free -m | head -2
          python -c "import sqlite3; c=sqlite3.connect(':memory:'); c.execute('CREATE VIRTUAL TABLE t USING fts5(x)'); print('FTS5 есть')"

      - name: Зависимости
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet onnxruntime==1.19.2 transformers sentence-transformers pymorphy3 numpy

      - name: Скачать движок из hranilishe
        run: |
          mkdir -p движок
          curl -sSL -o движок/engine.py "https://raw.githubusercontent.com/Ayt1741/hranilishe/main/%D0%B4%D0%B2%D0%B8%D0%B6%D0%BE%D0%BA/engine.py"
          wc -l движок/engine.py

      - name: Скачать реранкер (376 МБ int8)
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download("metalmon80/bge-reranker-v2-m3-en-ru-onnx", local_dir="движок/модели/реранк",
                            allow_patterns=["model.int8.onnx","tokenizer.json","config.json",
                                            "tokenizer_config.json","special_tokens_map.json","vocab.txt","*.model"])
          print("реранк скачан")
          PY

      - name: Сборка индекса и эмбеддингов
        if: github.event.inputs.step != 'search'
        run: |
          cd движок && python engine.py build
          ls -la данные/ | head -20
          du -sh данные/* 2>/dev/null

      - name: Замер MRR
        if: github.event.inputs.step == 'eval'
        run: cd движок && python engine.py eval

      - name: Поиск
        if: github.event.inputs.step == 'search'
        run: |
          cd движок && python engine.py build
          python engine.py search "${{ github.event.inputs.query }}"

      - name: Итог
        if: always()
        run: |
          echo "=== состояние ==="
          free -m | head -2
          ls -la движок/данные/ 2>/dev/null || echo "данных нет"

      - name: Отдать результат
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-engine-result
          path: |
            движок/данные/*.db
            движок/данные/*.npy
          retention-days: 14
          if-no-files-found: warn
